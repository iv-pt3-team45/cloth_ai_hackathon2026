# Cloud Run(cloth-ai-agent)の環境変数(spec 035)。
# `gcloud run deploy --env-vars-file backend/env.deploy.yaml` で渡す。既存の環境変数はすべて置き換わる。
#
# 本番で既定値(app/core/config.py)から変える必要がある値だけを書く。
# モデル名などはコードの既定値に任せる(ここに書くと二重管理になり、古くなりやすいため)。
#
# 秘密情報はここに書かない。YouTube の API キーは Secret Manager の youtube-data-api-key から
# `--set-secrets YOUTUBE_DATA_API_KEY=youtube-data-api-key:latest` で渡す。

# ログを JSON 形式にする(Cloud Logging で読みやすくする)
ENVIRONMENT: 'prod'
LOG_LEVEL: 'INFO'

# Gemini は Vertex AI 経由で呼ぶ(実行用サービスアカウントの権限を使う。API キーは不要)
GOOGLE_GENAI_USE_VERTEXAI: 'true'
GOOGLE_CLOUD_PROJECT: 'ai-agent-hackathon-508804'
# 東京リージョン指定では新しいモデルが使えないため global
GOOGLE_CLOUD_LOCATION: 'global'

# Firebase Hosting の画面からの呼び出しを許可する(JSON の形式で書く)
CORS_ORIGINS: '["https://ai-agent-hackathon-508804.web.app","https://ai-agent-hackathon-508804.firebaseapp.com"]'

# 手持ちの服(写真と index.json)は Cloud Storage に保存する(spec 036)。再デプロイしても消えない。
# 実行用のサービスアカウントには、このバケットの roles/storage.objectUser だけを付けている
WARDROBE_STORAGE: 'gcs'
WARDROBE_GCS_BUCKET: 'ai-agent-hackathon-508804-wardrobe'

# 画像生成のプロンプト全文をログに出すデバッグ用の設定。本番ではログが膨らむため止める
IMAGE_DEBUG_LOG: 'false'
