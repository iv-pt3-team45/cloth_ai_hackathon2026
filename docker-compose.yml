# ローカル開発用: バックエンド(FastAPI) とフロントエンド(Flutter Web) を同時起動する。
#   docker compose up --build
#   フロント: http://localhost:8080  /  API ドキュメント: http://localhost:8000/docs
name: tx-hackathon-gc

services:
  backend:
    build:
      context: ./backend
    container_name: tx-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Windows のバインドマウントでは inotify が効かないためポーリングで監視する
      WATCHFILES_FORCE_POLLING: "true"
      # サービスアカウントキーを使う場合のみ有効化する(既定は ADC)
      # GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
      # ADC(gcloud auth application-default login で作った資格情報)をコンテナに渡す。
      # ホスト側のパスはリポジトリ直下の .env で GCLOUD_CONFIG_DIR に設定する。
      - ${GCLOUD_CONFIG_DIR:?リポジトリ直下の .env に GCLOUD_CONFIG_DIR を設定してください(.env.example 参照)}:/root/.config/gcloud:ro
      # サービスアカウントキーを使う場合のみ有効化する
      # - ./infra/secrets:/secrets:ro
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: tx-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - frontend-pub-cache:/root/.pub-cache
      - frontend-dart-tool:/app/.dart_tool
    # ブラウザはホスト側で動くため、API 参照先はホストから見た URL を指定する
    command: >
      flutter run -d web-server
      --web-hostname 0.0.0.0 --web-port 8080
      --dart-define=API_BASE_URL=http://localhost:8000
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-venv:
  frontend-pub-cache:
  frontend-dart-tool:
